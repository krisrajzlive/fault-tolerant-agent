[project]
name = "fault-tolerant-agent"
version = "0.1.0"
description = "LangChain agent hardened with rate limiting, retries, fallback, refusal handling, tool-error recovery, call budgets and context management."
readme = "README.md"
license = { text = "MIT" }
keywords = ["langchain", "langgraph", "agents", "middleware", "resilience", "retries", "fallback", "azure-ai-foundry"]
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4.9",
  "langgraph>=1.2",
  "langchain-openai>=1.0",
  "azure-identity>=1.17",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ft-agent = "fault_tolerant_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fault_tolerant_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
